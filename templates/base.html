<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} - Restaurant Rating Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header><div class="wrap"><nav>
  <strong>&#127869; Restaurant Rating Panel</strong>
  <a href="/" class="{{ 'active' if active == 'home' }}">Results</a>
  <a href="/stats" class="{{ 'active' if active == 'stats' }}">Statistics</a>
  <a href="/restaurants" class="{{ 'active' if active == 'browse' }}">Browse</a>
  <a href="/search" class="{{ 'active' if active == 'search' }}">Search</a>
  <a href="/mistakes" class="{{ 'active' if active == 'mistakes' }}">Mistakes</a>
  <button type="button" id="theme-toggle" class="icon-button" title="Switch between light and dark theme" aria-label="Switch between light and dark theme"></button>
</nav></div></header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
<footer><div class="wrap">Data: Zomato Restaurants (Kaggle). Everything on this site is read live from PostgreSQL.</div></footer>
</body>
</html>
