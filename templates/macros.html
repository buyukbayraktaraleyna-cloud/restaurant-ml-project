{% macro rating(value) -%}
  {% if value is none or value == 0 -%}
    <span class="pill">not rated</span>
  {%- elif value >= 3.5 -%}
    <span class="pill good">{{ value }}</span>
  {%- else -%}
    <span class="pill bad">{{ value }}</span>
  {%- endif %}
{%- endmacro %}

{% macro bar(percent) -%}
  <div class="bar"><span style="width: {{ '%.1f'|format(percent) }}%"></span></div>
{%- endmacro %}
